<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zolve | Executive Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .manager-card { background: white; border-radius: 24px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .zolve-orange { color: #FF8C00; }
        .bg-zolve { background: #FF8C00; }
    </style>
</head>
<body class="pb-10">

    <nav class="bg-black text-white p-6 sticky top-0 z-50 flex justify-between items-center shadow-xl">
        <div class="flex items-center gap-4">
            <img src="https://framerusercontent.com/images/GGZvpxRoR5rvbhD217LMjFBPfA.png" class="h-6 invert brightness-0">
            <h1 class="text-xs font-black uppercase tracking-[0.2em] border-l border-white/20 pl-4">Command Center</h1>
        </div>
        <div class="flex gap-4">
            <select id="timeFilter" onchange="fetchData()" class="bg-white/10 border border-white/20 rounded-xl px-4 py-2 text-xs font-black outline-none cursor-pointer">
                <option value="today" class="text-black">TODAY</option>
                <option value="week" class="text-black" selected>THIS WEEK (MON-RESET)</option>
                <option value="month" class="text-black">THIS MONTH</option>
            </select>
            <button onclick="fetchData()" class="bg-zolve px-6 py-2 rounded-xl text-xs font-black">SYNC LIVE</button>
        </div>
    </nav>

    <div class="max-w-[1600px] mx-auto p-6 space-y-8">
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div class="manager-card p-6 border-t-4 border-t-orange-500">
                <p class="text-[10px] font-black text-slate-400 uppercase">Total Visits</p>
                <div class="flex items-center gap-2 mt-2">
                    <h2 id="totalVisits" class="text-4xl font-black">0</h2>
                    <span id="growthInsight" class="text-[10px] font-black text-green-500">▲ 0%</span>
                </div>
            </div>
            <div class="manager-card p-6">
                <p class="text-[10px] font-black text-slate-400 uppercase">Top Performer</p>
                <h2 id="topBDM" class="text-xl font-black mt-2 text-slate-800">---</h2>
            </div>
            <div class="manager-card p-6">
                <p class="text-[10px] font-black text-slate-400 uppercase">Coverage Area</p>
                <h2 id="uniquePartners" class="text-4xl font-black mt-2">0</h2>
            </div>
            <div class="manager-card p-6 bg-slate-900 text-white border-none">
                <p class="text-[10px] font-black text-slate-500 uppercase">Weekly Auto-Reset</p>
                <h2 id="resetClock" class="text-sm font-black mt-2 text-orange-400">Monday @ 00:00</h2>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 manager-card p-8">
                <h3 class="font-black text-sm uppercase mb-6 flex items-center gap-2">
                    <i class="fa-solid fa-chart-line zolve-orange"></i> BDM Performance Trend
                </h3>
                <div class="h-[300px]">
                    <canvas id="performanceChart"></canvas>
                </div>
            </div>
            <div class="manager-card p-8">
                <h3 class="font-black text-sm uppercase mb-6">Comparison Insights</h3>
                <div id="insightsList" class="space-y-4">
                    </div>
            </div>
        </div>

        <div class="manager-card overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-slate-50 border-b">
                    <tr class="text-[10px] font-black text-slate-400 uppercase">
                        <th class="p-5">BDM Personnel</th>
                        <th class="p-5">Partner</th>
                        <th class="p-5">Outcome Summary</th>
                        <th class="p-5">Next Action</th>
                        <th class="p-5 text-right">Verification</th>
                    </tr>
                </thead>
                <tbody id="dataTable" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://nuxwepcakevjerwksysk.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_PzIsajrfphOXJ_bALgkRkg_ZPCHS--e';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let myChart = null;

        async function fetchData() {
            const filter = document.getElementById('timeFilter').value;
            let start = new Date();
            start.setHours(0,0,0,0);

            if(filter === 'week') {
                const day = start.getDay();
                const diff = start.getDate() - day + (day === 0 ? -6 : 1); // Monday Reset
                start.setDate(diff);
            } else if (filter === 'month') {
                start.setDate(1);
            }

            const { data, error } = await _supabase.from('visits')
                .select('*')
                .gte('created_at', start.toISOString())
                .order('created_at', { ascending: false });

            if (!error) processData(data);
        }

        function processData(data) {
            const bdmData = {};
            data.forEach(v => bdmData[v.bdm_name] = (bdmData[v.bdm_name] || 0) + 1);

            // Update Stats
            document.getElementById('totalVisits').innerText = data.length;
            document.getElementById('uniquePartners').innerText = [...new Set(data.map(d => d.channel_name))].length;
            
            const sorted = Object.entries(bdmData).sort((a,b) => b[1] - a[1]);
            document.getElementById('topBDM').innerText = sorted[0] ? sorted[0][0] : "N/A";

            renderChart(bdmData);
            renderTable(data);
            renderInsights(sorted, data.length);
        }

        function renderChart(bdmData) {
            const ctx = document.getElementById('performanceChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Object.keys(bdmData),
                    datasets: [{
                        label: 'Visits per BD',
                        data: Object.values(bdmData),
                        borderColor: '#FF8C00',
                        backgroundColor: 'rgba(255, 140, 0, 0.1)',
                        fill: true,
                        tension: 0.4,
                        borderWidth: 4,
                        pointRadius: 6,
                        pointBackgroundColor: '#000'
                    }]
                },
                options: { maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        function renderTable(data) {
            document.getElementById('dataTable').innerHTML = data.map(row => {
               // Change 'visit-photos' to 'VISIT-PHOTOS' to match your Supabase bucket
const imgUrl = `${SUPABASE_URL}/storage/v1/object/public/VISIT-PHOTOS/${row.photo_url}`;
                return `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-5 font-black text-slate-900">${row.bdm_name}</td>
                        <td class="p-5 font-bold text-orange-600">${row.channel_name}</td>
                        <td class="p-5 text-xs text-slate-500 max-w-xs truncate">${row.outcome}</td>
                        <td class="p-5"><span class="bg-blue-50 text-blue-700 px-3 py-1 rounded-full text-[10px] font-black">${row.next_visit}</span></td>
                        <td class="p-5 text-right space-x-2">
                            <a href="${imgUrl}" target="_blank" class="text-slate-400 hover:text-black"><i class="fa-solid fa-image"></i></a>
                            <a href="https://www.google.com/maps?q=${row.latitude},${row.longitude}" target="_blank" class="text-slate-400 hover:text-orange-500"><i class="fa-solid fa-location-dot"></i></a>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function renderInsights(sorted, total) {
            const list = document.getElementById('insightsList');
            if(total === 0) { list.innerHTML = "<p class='text-xs font-bold text-slate-400'>No data for this period.</p>"; return; }
            
            list.innerHTML = sorted.slice(0, 3).map(([name, count]) => `
                <div class="flex justify-between items-center bg-slate-50 p-4 rounded-xl">
                    <div>
                        <p class="text-[10px] font-black text-slate-400 uppercase">${name}</p>
                        <p class="text-xs font-bold">${Math.round((count/total)*100)}% of total activity</p>
                    </div>
                    <div class="text-right font-black zolve-orange">${count}</div>
                </div>
            `).join('');
        }

        fetchData();
    </script>
</body>
</html>
