<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zolve Field Force</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <style>
        :root { --zolve-navy: #002D72; --zolve-blue: #0052FF; }
        body { background-color: #F8FAFC; font-family: 'Inter', sans-serif; }
        .btn-primary { background-color: var(--zolve-blue); color: white; border-radius: 8px; padding: 12px; width: 100%; font-weight: 600; }
        .btn-primary:disabled { background-color: #94a3b8; }
    </style>
</head>
<body class="p-4">
    <div class="max-w-md mx-auto">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-[#002D72]">Zolve Field Force</h1>
            <p class="text-gray-500 text-sm">Strict Camera Entry System</p>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <form id="visitForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">BD Name</label>
                    <select id="bdName" class="w-full border p-2 rounded-lg bg-gray-50" required>
                        <option value="">Select your name...</option>
                        <option>Anirudh</option><option>Charith</option><option>Chetan</option>
                        <option>Deepak</option><option>Ganesh</option><option>Kiran</option>
                        <option>Naveen</option><option>Prajwal</option><option>Rahul</option>
                        <option>Sandeep</option><option>Varun</option><option>Vijay</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Client/Channel Name</label>
                    <input type="text" id="clientName" class="w-full border p-2 rounded-lg" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Meeting Status</label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="border p-2 rounded-lg text-center cursor-pointer hover:bg-blue-50">
                            <input type="radio" name="status" value="Warm" required> Warm
                        </label>
                        <label class="border p-2 rounded-lg text-center cursor-pointer hover:bg-blue-50">
                            <input type="radio" name="status" value="Hot"> Hot
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
                    <textarea id="notes" class="w-full border p-2 rounded-lg" rows="3"></textarea>
                </div>

                <div class="py-2">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Visit Photo (Live Only)</label>
                    <input type="file" id="photo" accept="image/*" capture="environment" class="hidden" required>
                    <button type="button" onclick="document.getElementById('photo').click()" class="w-full border-2 border-dashed border-blue-400 p-4 rounded-lg text-blue-600 font-medium">
                        📸 Open Rear Camera
                    </button>
                    <p id="fileInfo" class="text-xs mt-1 text-gray-500 italic"></p>
                </div>

                <button type="submit" id="submitBtn" class="btn-primary">Submit Visit</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://nuxwepcakevjerwksysk.supabase.co';
        const SUPABASE_KEY = 'YOUR_ANON_KEY_HERE'; 
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('photo').onchange = function(e) {
            const size = (e.target.files[0].size / 1024 / 1024).toFixed(2);
            document.getElementById('fileInfo').innerText = `Original: ${size}MB (Will be compressed)`;
        };

        document.getElementById('visitForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerText;
            btn.innerText = "Compressing & Uploading...";
            btn.disabled = true;

            try {
                // 1. Get Location
                const pos = await new Promise((res, rej) => {
                    navigator.geolocation.getCurrentPosition(res, rej, {timeout: 10000});
                });

                // 2. COMPRESSION LOGIC
                const imageFile = document.getElementById('photo').files[0];
                const options = {
                    maxSizeMB: 0.5,          // Max size 500KB
                    maxWidthOrHeight: 1280,  // Resize to standard HD
                    useWebWorker: true
                }
                const compressedFile = await imageCompression(imageFile, options);

                // 3. Upload Compressed Image
                const fileName = `${Date.now()}_${document.getElementById('bdName').value}.jpg`;
                const { data: uploadData, error: uploadError } = await supabase.storage
                    .from('visit-photos')
                    .upload(fileName, compressedFile);

                if (uploadError) throw uploadError;

                // 4. Save to Database
                const { error } = await supabase.from('visits').insert([{
                    bd_name: document.getElementById('bdName').value,
                    client_name: document.getElementById('clientName').value,
                    meeting_status: document.querySelector('input[name="status"]:checked').value,
                    notes: document.getElementById('notes').value,
                    photo_url: fileName,
                    latitude: pos.coords.latitude,
                    longitude: pos.coords.longitude
                }]);

                if (error) throw error;
                alert("Visit logged successfully!");
                location.reload();

            } catch (err) {
                alert("Failed: " + err.message);
                btn.innerText = originalText;
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
