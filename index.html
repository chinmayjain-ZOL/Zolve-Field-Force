<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zolve | BDM Visit Tracker</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #000; padding-bottom: 40px; }
        
        .form-label { font-weight: 900; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; display: block; }
        .required-star { color: #FF8C00; }
        
        /* The Exact Input Style */
        .input-field { 
            border: 2px solid #000; 
            border-radius: 14px; 
            padding: 16px; 
            width: 100%; 
            outline: none; 
            font-weight: 700; 
            font-size: 16px;
            background: #fff;
            transition: all 0.2s ease;
            appearance: none; /* For cleaner select arrows */
        }

        /* The Orange Glow Focus */
        .input-field:focus { 
            border-color: #FF8C00; 
            box-shadow: 0 0 0 1px #FF8C00;
        }

        .btn-black { background: #000; color: #fff; border-radius: 12px; font-weight: 700; width: 100%; padding: 18px; text-transform: uppercase; margin-top: 10px; }
        .btn-orange { background: #FF8C00; color: #fff; border-radius: 14px; font-weight: 900; width: 100%; padding: 22px; text-transform: uppercase; font-size: 20px; border: none; cursor: pointer; }
        
        .divider { border-bottom: 1px solid #f2f2f2; margin: 28px 0; }

        /* Custom Camera Interface */
        #cameraUI { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; flex-direction: column; }
        #videoFeed { width: 100%; height: 100%; object-fit: cover; }
        .cam-controls { position: absolute; bottom: 50px; width: 100%; display: flex; justify-content: space-around; align-items: center; }
        .shutter { width: 80px; height: 80px; background: white; border-radius: 50%; border: 8px solid rgba(255,255,255,0.3); }
        
        .flatpickr-calendar { border-radius: 15px; border: 2px solid #000; }
    </style>
</head>
<body class="p-5">

    <div class="max-w-xl mx-auto text-center mb-10 pt-4">
        <img src="https://framerusercontent.com/images/GGZvpxRoR5rvbhD217LMjFBPfA.png" alt="Zolve" class="h-10 mx-auto mb-3">
        <h1 class="text-xl font-black uppercase tracking-tight">BDM Visit Tracker</h1>
        <div class="w-12 h-1.5 bg-orange-500 mx-auto mt-2 rounded-full"></div>
    </div>

    <form id="visitForm" class="max-w-xl mx-auto">
        
        <label class="form-label">Channel Name <span class="required-star">*</span></label>
        <input type="text" id="channel_name" placeholder="Type name here" class="input-field" required>
        <div class="divider"></div>

        <label class="form-label">BDM Name <span class="required-star">*</span></label>
        <select id="bdm_name" class="input-field" required>
            <option value="">-Select BDM-</option>
            <option>Anirudh</option>
            <option>Charith</option>
            <option>Chetan</option>
            <option>Deepansh</option>
            <option>Kunal</option>
            <option>Leela Sai Vardhan</option>
            <option>Nitish</option>
            <option>Shantha kumar</option>
            <option>Suneet</option>
            <option>Vamsi</option>
            <option>Vinay</option>
        </select>
        <div class="divider"></div>

        <label class="form-label">Visit Date <span class="required-star">*</span></label>
        <input type="text" id="visit_date" class="input-field datepicker" placeholder="Select Date" required>
        <div class="divider"></div>

        <label class="form-label">Meeting Reason <span class="required-star">*</span></label>
        <select id="meeting_reason" class="input-field" required>
            <option value="New Channel Partner">1. New Channel Partner</option>
            <option value="Follow - up">2. Follow - up</option>
            <option value="Existing Channel Partner">3. Existing Channel Partner</option>
            <option value="Other">Other</option>
        </select>
        <div class="divider"></div>

        <label class="form-label">Meeting Outcome <span class="required-star">*</span></label>
        <textarea id="outcome" rows="3" placeholder="Enter meeting summary" class="input-field" required></textarea>
        <div class="divider"></div>

        <label class="form-label">Current Status <span class="required-star">*</span></label>
        <select id="status" class="input-field" required>
            <option value="">-Select Stage-</option>
            <option value="Meeting Done">Meeting Done</option>
            <option value="Agreement Signed">Agreement Signed</option>
            <option value="Follow-up Required">Follow-up Required</option>  
        </select>
        <div class="divider"></div>

        <label class="form-label">Next Visit Date <span class="required-star">*</span></label>
        <input type="text" id="next_visit" class="input-field datepicker" placeholder="Select Date" required>
        <div class="divider"></div>

        <label class="form-label">Visit Photo <span class="required-star">*</span></label>
        <div id="previewContainer" class="hidden mb-4">
            <img id="photoPreview" class="w-full h-56 object-cover rounded-2xl border-2 border-black">
        </div>
        <button type="button" id="camBtn" onclick="startCamera()" class="btn-black">OPEN CAMERA</button>
        <p id="camStatus" class="text-gray-400 italic text-[11px] text-center mt-3"></p>
        
        <div class="mt-12">
            <button type="submit" id="submitBtn" class="btn-orange shadow-lg">SUBMIT VISIT</button>
        </div>
    </form>

    <div id="cameraUI">
        <video id="videoFeed" autoplay playsinline></video>
        <div class="cam-controls">
            <button onclick="stopCamera()" class="text-white text-sm font-bold">CANCEL</button>
            <button onclick="capturePhoto()" class="shutter"></button>
            <button onclick="flipCamera()" class="text-white text-2xl">🔄</button>
        </div>
    </div>

    <canvas id="canvas" class="hidden"></canvas>

    <script>
        const SUPABASE_URL = 'https://nuxwepcakevjerwksysk.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_PzIsajrfphOXJ_bALgkRkg_ZPCHS--e';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        flatpickr(".datepicker", { dateFormat: "Y-m-d", altInput: true, altFormat: "d-m-Y" });

        let stream = null;
        let facingMode = "environment";
        let photoBlob = null;

        async function startCamera() {
            try {
                if(stream) stream.getTracks().forEach(t => t.stop());
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode } });
                document.getElementById('videoFeed').srcObject = stream;
                document.getElementById('cameraUI').style.display = 'flex';
            } catch (err) { alert("Enable camera permissions."); }
        }

        function stopCamera() {
            if(stream) stream.getTracks().forEach(t => t.stop());
            document.getElementById('cameraUI').style.display = 'none';
        }

        function flipCamera() {
            facingMode = facingMode === "user" ? "environment" : "user";
            startCamera();
        }

        function capturePhoto() {
            const video = document.getElementById('videoFeed');
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            canvas.toBlob(blob => {
                photoBlob = blob;
                document.getElementById('photoPreview').src = URL.createObjectURL(blob);
                document.getElementById('previewContainer').classList.remove('hidden');
                document.getElementById('camStatus').innerText = "✅ PHOTO CAPTURED";
                document.getElementById('camStatus').style.color = "#059669";
                stopCamera();
            }, 'image/jpeg', 0.8);
        }

        document.getElementById('visitForm').onsubmit = async (e) => {
            e.preventDefault();
            if(!photoBlob) return alert("Please capture a photo first.");
            
            const btn = document.getElementById('submitBtn');
            btn.innerText = "CAPTURING LOCATION...";
            btn.disabled = true;

            navigator.geolocation.getCurrentPosition(async (pos) => {
                btn.innerText = "UPLOADING DATA...";
                const fileName = `live_${Date.now()}.jpg`;

                try {
                    await _supabase.storage.from('visit-photos').upload(fileName, photoBlob);
                    
                    const { error } = await _supabase.from('visits').insert([{
                        bdm_name: document.getElementById('bdm_name').value,
                        channel_name: document.getElementById('channel_name').value,
                        meeting_reason: document.getElementById('meeting_reason').value,
                        outcome: document.getElementById('outcome').value,
                        status: document.getElementById('status').value, // Insert status
                        visit_date: document.getElementById('visit_date').value,
                        next_visit: document.getElementById('next_visit').value,
                        photo_url: fileName,
                        latitude: pos.coords.latitude,
                        longitude: pos.coords.longitude
                    }]);

                    if(error) throw error;
                    alert("Visit Logged Successfully!");
                    location.reload();
                } catch (err) {
                    alert("Error: " + err.message);
                    btn.disabled = false;
                    btn.innerText = "SUBMIT VISIT";
                }
            }, () => { 
                alert("Location access is mandatory to submit."); 
                btn.disabled = false; 
                btn.innerText = "SUBMIT VISIT";
            }, { enableHighAccuracy: true });
        };
    </script>
</body>
</html>
